name: local-dope-wars

services:
  local-dope-wars:
    image: ghcr.io/oberones/local-dope-wars-js:${IMAGE_TAG:-latest}
    platform: linux/amd64
    container_name: local-dope-wars
    restart: always 
    user: "101:101"
    read_only: true
    cap_drop:
      - ALL
    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev,size=16m,mode=1777
    pids_limit: 64
    ports:
      - "127.0.0.1:${LOCAL_DOPE_WARS_PORT:-8081}:8080"
    networks:
      - web-backend
    # The image supplies the /index.html health check from Dockerfile.
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

networks:
  web-backend:
    name: ${LOCAL_DOPE_WARS_NETWORK:-web-backend}
    external: true
