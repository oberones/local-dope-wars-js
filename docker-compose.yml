services:
  local-dope-wars:
    container_name: local-dope-wars
    build:
      context: .
      dockerfile: Dockerfile
      args:
        VITE_BASE_PATH: ${VITE_BASE_PATH:-/}
    image: local-dope-wars:latest
    restart: always 
    ports:
      - "8081:80"
    networks:
      - web-backend

networks:
  web-backend:
    external: true
