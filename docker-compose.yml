services:
  local-dope-wars:
    container_name: local-dope-wars
    build:
      context: .
      dockerfile: Dockerfile
      args:
        VITE_BASE_PATH: ${VITE_BASE_PATH:-/}
    image: local-dope-wars:latest
    restart: unless-stopped
    user: "101:101"
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev,size=16m,mode=1777
    pids_limit: 64
    ports:
      - "127.0.0.1:${LOCAL_DOPE_WARS_PORT:-8081}:8080"
    networks:
      - web-backend
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

networks:
  web-backend:
    name: ${LOCAL_DOPE_WARS_NETWORK:-web-backend}
    external: true
