server {
  listen 8080;
  listen [::]:8080;
  server_name _;

  root /srv/local-dope-wars;
  index index.html;
  autoindex off;
  absolute_redirect off;

  add_header X-Content-Type-Options "nosniff" always;
  add_header Referrer-Policy "strict-origin-when-cross-origin" always;

  location ~ /\. {
    return 404;
  }

  # Revalidate the shell so deployments can select new content-hashed assets.
  location = /index.html {
    expires -1;
  }

  location / {
    try_files $uri $uri/ /index.html;
  }

  location /assets/ {
    expires 1y;
    add_header Cache-Control "public, immutable";
    # Locations with add_header directives do not inherit the server headers.
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    try_files $uri =404;
  }
}
